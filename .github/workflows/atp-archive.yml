name: Build ATP match archive

on:
  push:
    branches:
      - work/stage-2-model-training
    paths:
      - ".github/workflows/atp-archive.yml"
      - "scripts/download_atp_archive.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and combine ATP seasons 2010–2024
        run: python scripts/download_atp_archive.py --start 2010 --end 2024

      - name: Package combined CSV and source files
        run: |
          mkdir -p dist
          cp data/benchmark/atp_2010_2024.csv dist/
          cp benchmarks/atp_archive_2010_2024.md dist/README_benchmark.md
          cat > dist/SOURCE_AND_LICENSE.txt <<'EOF'
          Source data: Jeff Sackmann / Tennis Abstract ATP match results,
          obtained from the public mirror farhadGithub/tennis-atp-data.
          Source project: https://github.com/farhadGithub/tennis-atp-data
          License stated by the source project: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 (CC BY-NC-SA 4.0).
          This archive is intended for non-commercial research and evaluation.
          For commercial use or redistribution outside the license, obtain permission from the rights holder.
          EOF
          cd dist
          zip -9 tennis_predict_atp_2010_2024.zip atp_2010_2024.csv README_benchmark.md SOURCE_AND_LICENSE.txt
          sha256sum tennis_predict_atp_2010_2024.zip > SHA256SUMS.txt

      - name: Upload importable CSV
        uses: actions/upload-artifact@v4
        with:
          name: tennis-predict-atp-2010-2024
          path: |
            dist/tennis_predict_atp_2010_2024.zip
            dist/atp_2010_2024.csv
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
