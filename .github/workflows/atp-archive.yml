name: Build importable ATP and WTA CSV archives

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "scripts/download_tour_archives.py"
      - "scripts/download_atp_archive.py"
      - ".github/workflows/atp-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download current ATP and WTA archives
        run: |
          YEAR="$(date -u +%Y)"
          echo "ARCHIVE_YEAR=$YEAR" >> "$GITHUB_ENV"
          python scripts/download_tour_archives.py --start 2010 --end "$YEAR"

      - name: Package importable CSVs and source attribution
        run: |
          mkdir -p dist
          cp "data/benchmark/atp_2010_${ARCHIVE_YEAR}.csv" dist/
          cp "data/benchmark/wta_2010_${ARCHIVE_YEAR}.csv" dist/
          cat > dist/SOURCE_AND_LICENSE.txt <<'EOF'
          Primary data: Jeff Sackmann / Tennis Abstract ATP and WTA match results.
          Archival mirror: https://github.com/Aneeshers/tennis-sackmann-archive
          Primary license: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 (CC BY-NC-SA 4.0).

          Current-season supplement: Valuebetennis, Tennis results and odds since 2021.
          Source: https://www.valuebetennis.com/en/donnees.htm
          Supplement license: Creative Commons Attribution 4.0 (CC BY 4.0).

          These combined files include CC BY-NC-SA material and are intended for
          non-commercial research/evaluation. Attribute Jeff Sackmann / Tennis Abstract
          and Valuebetennis. Obtain permission from the rights holders for commercial use.
          EOF
          cat > dist/README_ARCHIVES.txt <<EOF
          Tennis Predict AI — importable historical match archives
          Seasons: 2010–${ARCHIVE_YEAR}
          CSV schema: date, player_a, player_b, winner, surface
          Archive date cutoff: build-day UTC, inclusive.
          Import both files using the app's multi-select CSV importer.
          Results are deduplicated by date, winner and loser. Top-tour current-season results
          after the primary mirror snapshot are supplemented from Valuebetennis data.
          EOF
          cd dist
          zip -9 "tennis_predict_atp_wta_2010_${ARCHIVE_YEAR}.zip" "atp_2010_${ARCHIVE_YEAR}.csv" "wta_2010_${ARCHIVE_YEAR}.csv" README_ARCHIVES.txt SOURCE_AND_LICENSE.txt
          sha256sum "tennis_predict_atp_wta_2010_${ARCHIVE_YEAR}.zip" > SHA256SUMS.txt

      - name: Upload ready-to-import CSV archives
        uses: actions/upload-artifact@v4
        with:
          name: tennis-predict-atp-wta-csv-archives-2010-${{ env.ARCHIVE_YEAR }}
          path: |
            dist/atp_2010_*.csv
            dist/wta_2010_*.csv
            dist/tennis_predict_atp_wta_2010_*.zip
            dist/README_ARCHIVES.txt
            dist/SOURCE_AND_LICENSE.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
